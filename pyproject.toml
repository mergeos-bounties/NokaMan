[project]
name = "nokaman"
version = "0.3.0"
description = "NokaMan assesses language-learning ability across multiple skills and languages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.5.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
llm = [
    "httpx>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build-meta"
